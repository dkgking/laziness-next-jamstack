<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <title>A static Next.js site: content from the CMS, exported to HTML pages</title>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 180) scale(260 200)">
      <stop stop-color="#c4f5c0" stop-opacity=".10"/>
      <stop offset="1" stop-color="#c4f5c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#e8ece8" fill-opacity=".06"/>
    </pattern>
    <clipPath id="cover"><rect x="416" y="118" width="152" height="60" rx="7"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="#141614"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- the CMS: a list of entries and the one being written -->
  <rect x="40" y="36" width="220" height="288" rx="14" fill="#1d201d" stroke="#2f332f"/>
  <line x1="40" y1="72" x2="260" y2="72" stroke="#2f332f"/>
  <rect x="56" y="45" width="18" height="18" rx="5" fill="#c4f5c0"/>
  <path d="M61 59V49l8 10V49" stroke="#0b1a0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="51" width="40" height="6" rx="3" fill="#e8ece8"/>
  <rect x="200" y="45" width="46" height="18" rx="6" fill="#c4f5c0"/>
  <rect x="210" y="52" width="26" height="4" rx="2" fill="#0b1a0c"/>

  <!-- entries -->
  <rect x="56" y="86" width="188" height="30" rx="8" fill="#2a2e2a"/>
  <rect x="66" y="94" width="14" height="14" rx="4" fill="#c4f5c0" fill-opacity=".2"/>
  <rect x="70" y="100" width="6" height="2" rx="1" fill="#c4f5c0"/>
  <rect x="88" y="95" width="92" height="6" rx="3" fill="#e8ece8"/>
  <rect x="88" y="105" width="52" height="4" rx="2" fill="#5a615a"/>
  <rect x="66" y="128" width="14" height="14" rx="4" fill="#252925"/>
  <rect x="88" y="129" width="74" height="6" rx="3" fill="#858a85"/>
  <rect x="88" y="139" width="44" height="4" rx="2" fill="#4a504a"/>
  <rect x="66" y="158" width="14" height="14" rx="4" fill="#252925"/>
  <rect x="88" y="159" width="104" height="6" rx="3" fill="#858a85"/>
  <rect x="88" y="169" width="38" height="4" rx="2" fill="#4a504a"/>
  <line x1="56" y1="186" x2="244" y2="186" stroke="#2f332f"/>

  <!-- the entry's Markdown -->
  <rect x="56" y="198" width="188" height="112" rx="8" fill="#181b18" stroke="#2f332f"/>
  <rect x="66" y="210" width="10" height="6" rx="3" fill="#c4f5c0" fill-opacity=".7"/>
  <rect x="80" y="210" width="84" height="6" rx="3" fill="#e8ece8"/>
  <rect x="66" y="226" width="164" height="5" rx="2.5" fill="#4a504a"/>
  <rect x="66" y="238" width="148" height="5" rx="2.5" fill="#4a504a"/>
  <rect x="66" y="250" width="158" height="5" rx="2.5" fill="#4a504a"/>
  <rect x="66" y="266" width="96" height="6" rx="3" fill="#c4f5c0" fill-opacity=".4"/>
  <rect x="66" y="282" width="140" height="5" rx="2.5" fill="#4a504a"/>
  <rect x="66" y="294" width="70" height="5" rx="2.5" fill="#4a504a"/>

  <!-- the export -->
  <path d="M260 180 H 282" stroke="#c4f5c0" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M322 180 H 376" stroke="#c4f5c0" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="302" cy="180" r="20" fill="#c4f5c0"/>
  <path d="M305 168l-9 14h7l-3 10 9-14h-7z" fill="#0b1a0c"/>

  <!-- the exported pages, one HTML file each -->
  <rect x="376" y="44" width="216" height="248" rx="12" fill="#cfcfcb" stroke="#2f332f"/>
  <rect x="388" y="56" width="216" height="248" rx="12" fill="#e3e3df" stroke="#2f332f"/>
  <rect x="400" y="68" width="200" height="256" rx="12" fill="#f4f4f2" stroke="#2f332f"/>
  <line x1="400.5" y1="94" x2="599.5" y2="94" stroke="#dcdcd8"/>
  <rect x="416" y="78" width="24" height="6" rx="3" fill="#121312"/>
  <rect x="446" y="78" width="24" height="6" rx="3" fill="#858582"/>
  <rect x="538" y="74" width="48" height="14" rx="7" fill="#121312"/>
  <rect x="547" y="79" width="30" height="4" rx="2" fill="#c4f5c0"/>
  <g clip-path="url(#cover)">
    <rect x="416" y="118" width="152" height="60" fill="#c4f5c0"/>
    <circle cx="540" cy="134" r="7" fill="#ffffff" fill-opacity=".85"/>
    <path d="M416 178 L454 146 L480 166 L506 142 L568 178z" fill="#1d7a35" fill-opacity=".35"/>
    <path d="M416 178 L440 162 L466 178z" fill="#1d7a35" fill-opacity=".5"/>
  </g>
  <rect x="416" y="104" width="60" height="5" rx="2.5" fill="#858582"/>
  <rect x="416" y="190" width="132" height="10" rx="5" fill="#121312"/>
  <rect x="416" y="205" width="84" height="10" rx="5" fill="#121312"/>
  <circle cx="421" cy="228" r="5" fill="#5f5f5c"/>
  <rect x="431" y="225.5" width="64" height="5" rx="2.5" fill="#858582"/>
  <rect x="416" y="244" width="168" height="5" rx="2.5" fill="#c9c9c5"/>
  <rect x="416" y="255" width="156" height="5" rx="2.5" fill="#c9c9c5"/>
  <rect x="416" y="266" width="164" height="5" rx="2.5" fill="#c9c9c5"/>
  <rect x="416" y="277" width="104" height="5" rx="2.5" fill="#c9c9c5"/>
  <rect x="416" y="294" width="80" height="7" rx="3.5" fill="#121312"/>
  <rect x="416" y="308" width="150" height="5" rx="2.5" fill="#c9c9c5"/>
</svg>
